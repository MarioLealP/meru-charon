[project]
name = "charon"
version = "0.1.0"
description = "Meru's purge - clears what a retired app left after its retention"
requires-python = ">=3.15"
dependencies = [
    "httpx2>=2.16.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sentry-sdk>=2.74.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.uv]
package = false # an app, not a library: the code runs from src/

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "Q", "C4", "FAST", "N", "PT", "ERA", "D", "complex-structure", "S"]
ignore = [
    "undocumented-public-init",
    # From S, the rules that guess from a name or an import: on Meru's code they only raised false alarms.
    "assert",
    "hardcoded-bind-all-interfaces",
    "hardcoded-password-string",
    "start-process-with-partial-path",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "unused-async"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ty.environment]
extra-paths = ["src"]
