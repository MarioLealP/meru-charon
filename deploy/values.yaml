# charon's deployment, rendered by Argo CD with Meru's nuwa-app chart. Shikigami fills in what comes from the
# request (owner, size, route) and adds deploy/meru.yaml - the marker that makes Meru deploy this repo - once the
# app's namespace fence, signing key and build credentials exist. CI writes the image after each build; until the
# first one the digest is a placeholder: nuwa-app renders everything but the workload (the build runner comes up, no
# pod waits on an image that doesn't exist yet).
name: charon
owner: mario
image:
  repository: zot.clockmost.com/meru/charon
  digest: sha256:6243e14028e9c5a165364fe8232e4b4643b51e69a2680c96d3ec61a6f9c9ea53
  tag: "4ba2eeb47373"
# A daily pass (D107), not a service: a CronJob, no Service, no probes. 11:00 Lisbon - after the 03:15 full backup (what
# a pass deletes is in that morning's backup) and when the server is on (a run missed by over an hour is skipped).
job:
  schedule: "0 11 * * *"
# Its own token for the cluster (Meru/meru rbac/): list and delete namespaces, read Argo Applications.
kubernetesApi:
  enabled: true
# Its own OpenBao login (D111): delete on a retired app's three entries, no read.
openbaoLogin:
  enabled: true
# The bot's token: read-only, on Meru/requests alone.
secretEnv:
  CHARON_GITEA_TOKEN:
    secret: gitea
    key: token
  # Its Zot login (D112): delete on repositories with no entry of their own.
  CHARON_ZOT_PASSWORD:
    secret: zot
    key: password
externalSecrets:
  gitea: {}
  zot: {}

# Crash reports (D125): this app's GlitchTip project, which Shikigami made (it predates the marker's own DSN line).
glitchtip:
  dsn: https://91a85a3eaa6c47d9aa7938e934930657@glitchtip.clockmost.com/2
