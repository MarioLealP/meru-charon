# charon's deployment, rendered by Argo CD with Meru's nuwa-app chart. Shikigami fills in what comes from the
# request (owner, size, route) and adds deploy/meru.yaml - the marker that makes Meru deploy this repo - once the
# app's namespace fence, signing key and build credentials exist. CI writes the image after each build; until the
# first one the digest is a placeholder: nuwa-app renders everything but the workload (the build runner comes up, no
# pod waits on an image that doesn't exist yet).
name: charon
owner: mario
image:
  repository: zot.clockmost.com/meru/charon
  digest: sha256:60b34e7d5b5abbd0518d500e63df13439080cf43f27dc14b64e458856095e920
  tag: "b7289f9117cb"
# A daily pass (D107), not a service: a CronJob, no Service, no probes. 11:00 Lisbon - after the 03:15 full backup (what
# a pass deletes is in that morning's backup) and when the server is on (a run missed by over an hour is skipped).
job:
  schedule: "0 11 * * *"
